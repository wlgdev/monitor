name: deploy-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ !startsWith(github.repository, 'wlgdev/template-') }}
    environment: PRODUCTION
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        uses: wlgdev/deploy/.github/actions/deploy@main
        with:
          pat: ${{ secrets.DEPLOY_TRIGGER_PAT }}
          target: "monitor:grafana:3000"
          is_dev: "false"
          # Keep these coordinates aligned with docker-compose.yml
          service_image_name: grafana/grafana
          service_image_tag: "13.2-slim"
          env: |
            GRAFANA_DEFAULT_DOMAIN=monitor.wlg.tv