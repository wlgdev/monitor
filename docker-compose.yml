volumes:
  monitor-grafana-data:
  monitor-loki-data:

services:
  grafana:
    image: grafana/grafana:13.2-slim
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DEFAULT_DOMAIN:?Set GRAFANA_DEFAULT_DOMAIN}
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_DISABLE_LOGIN_FORM: false
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - monitor-grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.7
    ports:
      - "127.0.0.1:3100:3100"
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - monitor-loki-data:/loki
    restart: unless-stopped