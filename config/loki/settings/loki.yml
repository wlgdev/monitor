auth_enabled: false         # disable tenants/auth, simpler single-user setup

server:
  http_listen_port: 3100    # Loki API port
  log_level: info           # normal logging verbosity

common:
  path_prefix: /loki        # root directory for all Loki data
  replication_factor: 1     # single-node instance, no replicas

schema_config:
  configs:
    - from: 2024-01-01          # schema active from this date
      store: tsdb               # modern storage engine
      object_store: filesystem  # store data on local disk
      schema: v13               # current stable schema
      index:
        prefix: index_          # prefix for generated index files
        period: 24h             # create new index every day

limits_config:
  retention_period: 336h        # keep logs for 14 days
  ingestion_rate_mb: 8          # max sustained ingestion per second
  ingestion_burst_size_mb: 16   # short bursts allowed above limit
  max_query_lookback: 336h      # dont look back more then retention_period
  
compactor:
  working_directory: /loki/compactor    # compaction workspace
  retention_enabled: true               # enable automatic deletion
  retention_delete_delay: 2h            # wait before deleting old data
  delete_request_store: filesystem      # store delete requests locally

ingester:
  wal:
    enabled: true             # enable write-ahead logging
    dir: /loki/wal            # location of WAL files

ruler:
  storage:
    type: local               # local filesystem storage
    local:
      directory: /loki/rules  # alerting rules location
  rule_path: /loki/rules-temp # temporary rule processing directory
  enable_api: true            # allow rule management via HTTP API
